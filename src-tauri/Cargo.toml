[package]
name = "armtemp"
version = "0.2.0"
description = "Native Snapdragon X / X2 temperature monitor for Windows on ARM"
authors = ["Spencer Francisco"]
edition = "2021"
rust-version = "1.77"

# Tauri apps have a lib + bin: lib is invoked by the shell, bin is the exe.
[lib]
name = "armtemp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Native Win32 access for the PDH sensor backend (ACPI thermal zones, processor
# load/frequency via pdh.dll) and CPU identity (registry + GetSystemInfo).
# No COM/WMI — see sensors/pdh.rs and SENSORS.md §7 for why that path is avoided.
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Performance",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Power",
] }

# Polling scheduler.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
# Nothing ARM-specific yet; kept for future per-core driver backend.

[features]
# This feature is used for production builds or when a dev server is not specified.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
